services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: guestbook
      POSTGRES_USER: ${DB_USERNAME:-guestbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guestbook}
    ports:
      - "5432:5432"
    volumes:
      - guestbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guestbook_pgdata: